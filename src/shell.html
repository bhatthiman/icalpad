<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>iCalPad</title>
<meta name="description" content="iCalPad: a free-form math worksheet with units, symbolic math, plots and pictures. Runs entirely in the browser.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Semi+Condensed:wght@500;600&family=STIX+Two+Text:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
/*__CSS__*/
</style>
</head>
<body>
<div id="app">
  <header class="top">
    <button class="btn icon" id="b-side" aria-label="Outline" title="Outline" aria-pressed="false"></button>
    <div class="brand" aria-label="iCalPad">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="2.5" width="18" height="19" rx="2" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M7.5 2.5v19" stroke="currentColor" stroke-width="1.1" opacity=".55"/><path d="M10 13.2l1.4-.7 1.6 4.3 2.6-9.3h3" fill="none" stroke="var(--pen)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span>iCalPad</span>
    </div>
    <div class="grp wide-only">
      <button class="btn icon" id="b-undo" aria-label="Undo" title="Undo"></button>
      <button class="btn icon" id="b-redo" aria-label="Redo" title="Redo"></button>
    </div>
    <span class="sep wide-only"></span>
    <div class="grp wide-only" role="group" aria-label="Add to the worksheet">
      <button class="btn" data-add="math" title="Add a math line"></button>
      <button class="btn" data-add="text" title="Add a note or heading"></button>
      <button class="btn" data-add="plot" title="Add a plot"></button>
      <button class="btn" data-add="picture" title="Add a picture from your device"></button>
      <button class="btn" data-add="sketch" title="Add a blank sketch to draw on"></button>
    </div>
    <span class="grow"></span>
    <button class="btn" id="b-ex" aria-haspopup="true">Examples</button>
    <button class="btn wide-only" id="b-file" aria-haspopup="true">File</button>
    <button class="chip wide-only" id="b-solver" aria-haspopup="true" title="Choose the solver"><span class="dot"></span><span id="solver-lbl">Built-in solver</span></button>
    <button class="btn icon wide-only" id="b-help" aria-label="How to type math" title="How to type math"></button>
    <button class="btn icon wide-only" id="b-set" aria-label="Settings" title="Settings"></button>
    <button class="btn icon narrow-only" id="b-more" aria-label="More" title="More"></button>
  </header>
  <div class="main">
    <aside class="side closed" id="side" aria-label="Outline">
      <h2>Outline</h2>
      <div class="pane" id="p-out"></div>
    </aside>
    <main class="desk" id="desk">
      <article class="sheet" id="sheet">
        <div class="tblock">
          <label><small>Subject</small><input class="title" id="f-title" type="text" autocomplete="off" placeholder="Untitled calculation"></label>
          <label><small>By</small><input id="f-by" type="text" autocomplete="off" placeholder="Initials"></label>
          <label><small>Date</small><input id="f-date" type="text" autocomplete="off"></label>
          <label><small>Sheet</small><input id="f-sheet" type="text" autocomplete="off" placeholder="1"></label>
        </div>
        <div class="rgs" id="rgs"></div>
        <div class="credit">Built by Sam Smith at K-State. Email me for feedback: <a href="mailto:samsmith@ksu.edu">samsmith@ksu.edu</a></div>
      </article>
    </main>
  </div>
  <footer class="status">
    <span id="st-lines"></span>
    <span id="st-time"></span>
    <span id="st-units"></span>
    <span class="grow">Built by Sam Smith at K-State (email me for feedback: <a href="mailto:samsmith@ksu.edu">samsmith@ksu.edu</a>)</span>
  </footer>
  <nav class="mbar" aria-label="Add to the worksheet">
    <button class="btn" data-add="math"></button>
    <button class="btn" data-add="text"></button>
    <button class="btn" data-add="plot"></button>
    <button class="btn" data-add="picture"></button>
    <button class="btn icon" id="b-undo2" aria-label="Undo" style="flex:0 0 44px"></button>
  </nav>
</div>
<input type="file" id="f-open" accept=".json,application/json" hidden>
<input type="file" id="f-img" accept="image/png,image/jpeg,image/gif,image/webp,image/svg+xml" multiple hidden>
<script>
/*__CORE__*/
</script>
<script>
/*__DATA__*/
</script>
<script>
/*__APP__*/
</script>
</body>
</html>
